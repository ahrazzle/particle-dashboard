<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Universe</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0f;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:#e0e0e0}
  canvas{display:block;position:fixed;top:0;left:0;z-index:0}

  .hud{position:fixed;top:20px;left:20px;z-index:10;background:rgba(10,10,20,0.85);
    backdrop-filter:blur(12px);border:1px solid rgba(100,140,255,0.15);
    border-radius:16px;padding:20px;width:280px;user-select:none;
    box-shadow:0 8px 32px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.05)}
  .hud h1{font-size:16px;font-weight:600;margin-bottom:4px;
    background:linear-gradient(135deg,#6ea8fe,#a78bfa);-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;letter-spacing:0.5px}
  .hud .subtitle{font-size:10px;color:#666;margin-bottom:16px;text-transform:uppercase;letter-spacing:1.5px}

  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;
    border-bottom:1px solid rgba(255,255,255,0.04)}
  .stat-row:last-child{border:none}
  .stat-label{font-size:11px;color:#888}
  .stat-val{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat-val.blue{color:#6ea8fe}
  .stat-val.purple{color:#a78bfa}
  .stat-val.green{color:#34d399}
  .stat-val.amber{color:#fbbf24}

  .control-group{margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06)}
  .control-group label{display:block;font-size:11px;color:#777;margin-bottom:6px;
    text-transform:uppercase;letter-spacing:1px}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;
    background:rgba(255,255,255,0.08);outline:none;margin-bottom:14px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
    border-radius:50%;background:linear-gradient(135deg,#6ea8fe,#a78bfa);cursor:pointer;
    box-shadow:0 0 8px rgba(110,168,254,0.4)}

  .mode-btns{display:flex;gap:6px;margin-top:8px}
  .mode-btn{flex:1;padding:8px 0;border:1px solid rgba(100,140,255,0.2);border-radius:8px;
    background:transparent;color:#888;font-size:11px;cursor:pointer;transition:all 0.2s;
    text-align:center;font-family:inherit;text-transform:uppercase;letter-spacing:0.5px}
  .mode-btn:hover{border-color:rgba(100,140,255,0.5);color:#ccc}
  .mode-btn.active{background:linear-gradient(135deg,rgba(110,168,254,0.2),rgba(167,139,250,0.2));
    border-color:rgba(110,168,254,0.5);color:#6ea8fe}

  .corner-info{position:fixed;bottom:20px;right:20px;z-index:10;font-size:11px;color:#444;
    text-align:right;letter-spacing:0.5px}

  .fps-badge{position:fixed;top:20px;right:20px;z-index:10;background:rgba(10,10,20,0.85);
    backdrop-filter:blur(12px);border:1px solid rgba(100,140,255,0.15);border-radius:10px;
    padding:10px 14px;font-size:12px;font-weight:600}
  .fps-badge span{color:#34d399}

  .legend{position:fixed;bottom:20px;left:20px;z-index:10;font-size:10px;color:#444;line-height:1.8}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="hud" id="hud">
  <h1>Particle Universe</h1>
  <div class="subtitle">Interactive Simulation</div>

  <div class="stat-row"><span class="stat-label">Particles</span><span class="stat-val blue" id="sCount">0</span></div>
  <div class="stat-row"><span class="stat-label">Connections</span><span class="stat-val purple" id="sConn">0</span></div>
  <div class="stat-row"><span class="stat-label">Avg Speed</span><span class="stat-val green" id="sSpeed">0</span></div>
  <div class="stat-row"><span class="stat-label">Entropy</span><span class="stat-val amber" id="sEntropy">0</span></div>

  <div class="control-group">
    <label>Particle Count: <span id="vCount">500</span></label>
    <input type="range" id="rCount" min="50" max="2000" value="500" step="50">

    <label>Gravity: <span id="vGrav">0.00</span></label>
    <input type="range" id="rGrav" min="0" max="100" value="0">

    <label>Chaos: <span id="vChaos">20</span></label>
    <input type="range" id="rChaos" min="0" max="100" value="20">

    <label>Trail Fade: <span id="vFade">97</span>%</label>
    <input type="range" id="rFade" min="80" max="100" value="97">
  </div>

  <div class="control-group">
    <label>Formation Mode</label>
    <div class="mode-btns">
      <button class="mode-btn active" data-mode="galaxy">Galaxy</button>
      <button class="mode-btn" data-mode="spiral">Spiral</button>
      <button class="mode-btn" data-mode="nova">Nova</button>
      <button class="mode-btn" data-mode="blackhole">Vortex</button>
    </div>
  </div>
</div>

<div class="fps-badge" id="fpsBadge"><span>60</span> FPS</div>
<div class="legend">Click & drag to attract · Scroll to repel<br>Double-click to spawn burst</div>
<div class="corner-info">Built with Canvas 2D + vanilla JS</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- State ---
const params = { count: 500, gravity: 0, chaos: 20, fade: 97, mode: 'galaxy' };
let particles = [];
let mouseX = 0, mouseY = 0, mouseDown = false, mouseActive = false;
let burstTimer = 0;
const CONNECTION_DIST = 120;
const COLORS = [
  [110, 168, 254], // blue
  [167, 139, 250], // purple
  [99, 210, 255],  // cyan
  [192, 132, 252], // violet
  [129, 230, 217], // mint
  [251, 191, 36],  // amber
];

// --- Particle ---
function createParticle(x, y, vx, vy, color) {
  return {
    x: x ?? Math.random() * W,
    y: y ?? Math.random() * H,
    vx: vx ?? (Math.random() - 0.5) * 2,
    vy: vy ?? (Math.random() - 0.5) * 2,
    color: color || COLORS[Math.floor(Math.random() * COLORS.length)],
    size: Math.random() * 2 + 1,
    life: 1,
    pulse: Math.random() * Math.PI * 2,
  };
}

function spawnBurst(x, y, n = 30) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 6 + 2;
    const col = COLORS[Math.floor(Math.random() * COLORS.length)];
    particles.push(createParticle(
      x + (Math.random() - 0.5) * 10,
      y + (Math.random() - 0.5) * 10,
      Math.cos(angle) * speed,
      Math.sin(angle) * speed,
      col
    ));
  }
}

function initParticles(n) {
  particles = [];
  const cx = W / 2, cy = H / 2;
  for (let i = 0; i < n; i++) {
    let px, py, vx, vy;
    if (params.mode === 'galaxy') {
      const arm = Math.floor(Math.random() * 3);
      const angle = (arm / 3) * Math.PI * 2 + Math.random() * 1.2;
      const dist = Math.random() * Math.min(W, H) * 0.35 + 20;
      px = cx + Math.cos(angle) * dist;
      py = cy + Math.sin(angle) * dist * 0.6;
      const orbital = Math.sqrt(400 / Math.max(dist, 50));
      vx = -Math.sin(angle) * orbital + (Math.random() - 0.5) * 0.5;
      vy = Math.cos(angle) * orbital * 0.6 + (Math.random() - 0.5) * 0.3;
    } else if (params.mode === 'spiral') {
      const t = (i / n) * Math.PI * 10;
      const r = (i / n) * Math.min(W, H) * 0.45;
      px = cx + Math.cos(t) * r;
      py = cy + Math.sin(t) * r;
      vx = (Math.random() - 0.5) * 0.8;
      vy = (Math.random() - 0.5) * 0.8;
    } else if (params.mode === 'nova') {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 20;
      px = cx + Math.cos(angle) * dist;
      py = cy + Math.sin(angle) * dist;
      const speed = Math.random() * 3 + 1;
      vx = Math.cos(angle) * speed;
      vy = Math.sin(angle) * speed;
    } else { // vortex
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * Math.min(W, H) * 0.4 + 30;
      px = cx + Math.cos(angle) * dist;
      py = cy + Math.sin(angle) * dist;
      const orbital = Math.sqrt(600 / dist) * 2;
      vx = -Math.sin(angle) * orbital;
      vy = Math.cos(angle) * orbital;
    }
    particles.push(createParticle(px, py, vx, vy));
  }
}

// --- Physics ---
function update() {
  const cx = W / 2, cy = H / 2;
  const grav = params.gravity * 0.0003;
  const chaos = params.chaos * 0.02;
  let totalSpeed = 0;

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];

    // Gravity toward center
    const dx = cx - p.x, dy = cy - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy) + 1;
    p.vx += dx / dist * grav;
    p.vy += dy / dist * grav;

    // Chaos (Brownian-ish)
    p.vx += (Math.random() - 0.5) * chaos;
    p.vy += (Math.random() - 0.5) * chaos;

    // Mouse interaction
    if (mouseActive) {
      const mdx = mouseX - p.x, mdy = mouseY - p.y;
      const mDist = Math.sqrt(mdx * mdx + mdy * mdy) + 1;
      if (mDist < 300) {
        const force = mouseDown ? 0.8 : -0.4;
        p.vx += mdx / mDist * force / (mDist * 0.01 + 1);
        p.vy += mdy / mDist * force / (mDist * 0.01 + 1);
      }
    }

    // Speed limit
    const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    const maxSpd = 8;
    if (spd > maxSpd) { p.vx *= maxSpd / spd; p.vy *= maxSpd / spd; }
    if (spd < 0.1) { p.vx *= 1.1; p.vy *= 1.1; } // boost slow ones

    p.x += p.vx;
    p.y += p.vy;
    p.pulse += 0.05;

    // Wrap around
    const margin = 50;
    if (p.x < -margin) p.x = W + margin;
    if (p.x > W + margin) p.x = -margin;
    if (p.y < -margin) p.y = H + margin;
    if (p.y > H + margin) p.y = -margin;

    totalSpeed += spd;
  }

  // Cap total particles
  const maxP = 3000;
  while (particles.length > maxP) particles.shift();

  // Sync count smoothly
  while (particles.length < params.count) {
    const cx2 = W / 2, cy2 = H / 2;
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * Math.min(W, H) * 0.4;
    const col = COLORS[Math.floor(Math.random() * COLORS.length)];
    particles.push(createParticle(
      cx2 + Math.cos(angle) * dist, cy2 + Math.sin(angle) * dist,
      (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5, col
    ));
  }
  while (particles.length > params.count + 50) particles.pop();

  return { count: particles.length, totalSpeed, connections: 0 };
}

// --- Rendering ---
function draw(stats) {
  // Trail fade
  const fadeAlpha = (100 - params.fade) / 100;
  ctx.fillStyle = `rgba(10, 10, 15, ${fadeAlpha})`;
  ctx.fillRect(0, 0, W, H);

  const connections = [];
  let connCount = 0;
  const connDist2 = CONNECTION_DIST * CONNECTION_DIST;

  // Spatial hashing for connections
  const cellSize = CONNECTION_DIST;
  const grid = {};
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const gx = Math.floor(p.x / cellSize);
    const gy = Math.floor(p.y / cellSize);
    const key = `${gx},${gy}`;
    if (!grid[key]) grid[key] = [];
    grid[key].push(i);
  }

  // Draw connections
  ctx.lineWidth = 0.5;
  for (const key in grid) {
    const [gx, gy] = key.split(',').map(Number);
    const neighbors = [
      `${gx-1},${gy-1}`, `${gx},${gy-1}`, `${gx+1},${gy-1}`,
      `${gx-1},${gy}`, `${gx},${gy}`, `${gx+1},${gy}`,
      `${gx-1},${gy+1}`, `${gx},${gy+1}`, `${gx+1},${gy+1}`,
    ];
    const cell = grid[key];
    for (let j = 0; j < cell.length; j++) {
      const i = cell[j];
      const pi = particles[i];
      for (const nk of neighbors) {
        const ncell = grid[nk];
        if (!ncell) continue;
        for (let k = 0; k < ncell.length; k++) {
          const m = ncell[k];
          if (m <= i) continue;
          const pm = particles[m];
          const ddx = pi.x - pm.x, ddy = pi.y - pm.y;
          const d2 = ddx * ddx + ddy * ddy;
          if (d2 < connDist2) {
            const alpha = (1 - Math.sqrt(d2) / CONNECTION_DIST) * 0.25;
            ctx.strokeStyle = `rgba(110,168,254,${alpha})`;
            ctx.beginPath();
            ctx.moveTo(pi.x, pi.y);
            ctx.lineTo(pm.x, pm.y);
            ctx.stroke();
            connCount++;
          }
        }
      }
    }
  }

  // Draw particles
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const [r, g, b] = p.color;
    const pulseSize = p.size + Math.sin(p.pulse) * 0.5;
    const glow = p.size * 3;

    // Glow
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glow);
    grad.addColorStop(0, `rgba(${r},${g},${b},0.6)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, glow, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = `rgba(${Math.min(255, r + 80)},${Math.min(255, g + 80)},${Math.min(255, b + 80)},0.9)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, pulseSize, 0, Math.PI * 2);
    ctx.fill();
  }

  // Center glow
  const cGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 100);
  cGrad.addColorStop(0, `rgba(167,139,250,${0.03 + params.gravity * 0.0005})`);
  cGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = cGrad;
  ctx.beginPath();
  ctx.arc(W / 2, H / 2, 100, 0, Math.PI * 2);
  ctx.fill();
}

// --- UI ---
const $ = id => document.getElementById(id);
let stats = { count: 0, totalSpeed: 0, connections: 0 };

function updateStats() {
  $('sCount').textContent = stats.count;
  $('sConn').textContent = stats.connections;
  $('sSpeed').textContent = (stats.totalSpeed / Math.max(stats.count, 1)).toFixed(2);
  const entropy = params.entropy.toFixed(1);
  $('sEntropy').textContent = entropy;
}

function updateEntropy() {
  if (particles.length < 2) return;
  let totalDist = 0;
  const cx = W / 2, cy = H / 2;
  for (const p of particles) {
    totalDist += Math.sqrt((p.x - cx) ** 2 + (p.y - cy) ** 2);
  }
  const avgDist = totalDist / particles.length;
  const maxDist = Math.min(W, H) * 0.5;
  params.entropy = (avgDist / maxDist * 100);
}

// Controls
$('rCount').oninput = function () {
  params.count = +this.value;
  $('vCount').textContent = this.value;
};
$('rGrav').oninput = function () {
  params.gravity = +this.value;
  $('vGrav').textContent = (this.value / 100).toFixed(2);
};
$('rChaos').oninput = function () {
  params.chaos = +this.value;
  $('vChaos').textContent = this.value;
};
$('rFade').oninput = function () {
  params.fade = +this.value;
  $('vFade').textContent = this.value;
};
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = function () {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    params.mode = this.dataset.mode;
    initParticles(params.count);
  };
});

// Mouse
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; mouseActive = true; });
canvas.addEventListener('mousedown', e => { mouseDown = true; mouseActive = true; });
canvas.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('mouseleave', () => { mouseActive = false; mouseDown = false; });
canvas.addEventListener('wheel', e => {
  // Repel nearby
  for (const p of particles) {
    const dx = p.x - e.clientX, dy = p.y - e.clientY;
    const d = Math.sqrt(dx * dx + dy * dy) + 1;
    if (d < 150) {
      const f = (150 - d) * 0.05 * (e.deltaY > 0 ? 1 : -1);
      p.vx += (dx / d) * f;
      p.vy += (dy / d) * f;
    }
  }
}, { passive: true });
canvas.addEventListener('dblclick', e => { spawnBurst(e.clientX, e.clientY, 40); });

// Touch support
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  mouseX = e.touches[0].clientX;
  mouseY = e.touches[0].clientY;
  mouseActive = true;
  mouseDown = true;
}, { passive: false });
canvas.addEventListener('touchend', () => { mouseActive = false; mouseDown = false; });

// --- Main Loop ---
let lastTime = performance.now();
let frameCount = 0;
let fps = 60, fpsTimer = 0;
let statsTimer = 0;

initParticles(params.count);

function loop(now) {
  requestAnimationFrame(loop);

  const dt = now - lastTime;
  lastTime = now;

  // FPS
  frameCount++;
  fpsTimer += dt;
  if (fpsTimer > 500) {
    fps = Math.round(1000 / (fpsTimer / frameCount));
    $('fpsBadge').innerHTML = `<span>${fps}</span> FPS`;
    frameCount = 0;
    fpsTimer = 0;
  }

  stats = update();

  statsTimer += dt;
  if (statsTimer > 200) {
    updateEntropy();
    updateStats();
    statsTimer = 0;
  }

  draw(stats);
}

requestAnimationFrame(loop);

// Initial clear
ctx.fillStyle = '#0a0a0f';
ctx.fillRect(0, 0, W, H);
</script>
</body>
</html>
